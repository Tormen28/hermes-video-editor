title: Video Editor
description: "A Hermes Desktop pane that edits and exports real video on the user's own machine: timeline, text, colour, speed and transitions, rendered to MP4 by the local FFmpeg. Disclosure — it reads and writes project files and exported MP4s in its own data folder, starts a local HTTP service bound to 127.0.0.1 that the pane talks to, and runs the local FFmpeg binary as a subprocess; optional AI providers (images, music, voice) make network calls only when the user configures a key, and are never required. No telemetry, no uploads, no watermark, no self-updater. Tested on Windows 11."
