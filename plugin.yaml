name: hermes-cinema
label: Video Editor
kind: standalone
version: 0.3.5
author: "Tormen28"
license: MIT
requires_hermes: ">=0.23.0"
manifest_version: 2
provides_tools: [cinema_status, cinema_start]
provides_hooks: []
homepage: "https://github.com/Tormen28/hermes-video-editor"
description: >
  A Hermes Desktop pane that edits and exports real video on your own machine:
  timeline, text, colour, speed and transitions, rendered to MP4 by the local
  FFmpeg. Optional AI providers (images, music, voice) are choices, never
  requirements — with no keys the editor still cuts, titles and exports. No
  cloud account, no uploads, no watermark, no telemetry.
tags: [desktop, video, editing, ffmpeg, local]
